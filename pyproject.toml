[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ChronoRay"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ray[tune]>=2.34",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "cloudpickle",
    "pymc>=5,<6",
    "arviz<1",
]

[tool.setuptools.packages.find]
include = ["ChronoRay*"]