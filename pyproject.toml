[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ChronoRay"
version = "0.1.0"
requires-python = ">=3.9,<3.13"
dependencies = [
    "ray[tune]>=2.34",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "cloudpickle",
    "bayesian-optimization",
]

[project.optional-dependencies]
calibration = ["pymc>=5,<6", "arviz<1"]
search = ["optuna", "hyperopt", "nevergrad", "ax-platform", "hebo", "zoopt"]

[tool.setuptools.packages.find]
include = ["ChronoRay*"]